name: Build and deploy site

on:
  push:
    branches: [main]
  # Manual run from the Actions tab.
  workflow_dispatch:
  # "Publish site" in /admin no longer comes through here: it runs AWS CodeBuild
  # (buildspec.yml) from the source copy scripts/deploy.sh uploads to S3.

concurrency:
  # A newer publish supersedes an in-flight one; never let two deploys race.
  group: deploy-site
  cancel-in-progress: false

env:
  AWS_REGION: us-west-2
  SITE_BUCKET: lovemesomecoding.com
  # Falls back to the known id so a missing secret can't silently target nothing.
  SITE_DISTRIBUTION: ${{ secrets.CLOUDFRONT_DIST_ID || 'E30YUPLP37MY9U' }}
  CONTENT_BUCKET: lovemesomecoding-db-329580012644-us-west-2-an
  NEXT_PUBLIC_SITE_URL: https://lovemesomecoding.com
  VERIFY_URL: https://lovemesomecoding.com

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Install dependencies
        run: npm ci

      - name: Sync content from S3
        run: npm run sync-content

      - name: Build
        # Fails if any of the 512 indexed post URLs stopped resolving.
        run: npm run build

      - name: Deploy, invalidate, and verify the edge serves this build
        # deploy.sh republishes the edge function, syncs S3, waits for the
        # invalidation to complete, then fetches version.txt back and fails if
        # CloudFront is still serving an older build.
        run: ./scripts/deploy.sh

      - name: Smoke test the live site
        run: |
          set -euo pipefail
          BASE="https://lovemesomecoding.com"
          fail=0
          for path in / /page/2 /java/java-25-migration-guide /java /about-me /sitemap.xml /rss.xml /robots.txt; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 5 "$BASE$path")
            echo "  $code  $path"
            [ "$code" = "200" ] || fail=1
          done
          # Retired pages must 301, not 404. java-8 was folded into java on 2026-08-20;
          # its indexed URLs now redirect, so they belong here rather than above.
          for path in /java-table-of-content /wp-sitemap.xml /page/1 /java-8 /java-8/java-25-migration-guide; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$BASE$path")
            echo "  $code  $path (expect 301)"
            [ "$code" = "301" ] || fail=1
          done
          exit $fail
