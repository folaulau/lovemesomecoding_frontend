name: Build and deploy site

on:
  push:
    branches: [main]
  # Manual run from the Actions tab.
  workflow_dispatch:
  # Fired by the admin API after a post is published — this is what makes
  # "static rebuild on publish" work. Send:
  #   POST /repos/folaulau/lovemesomecoding_frontend/dispatches
  #   {"event_type": "publish"}
  repository_dispatch:
    types: [publish]

concurrency:
  # A newer publish supersedes an in-flight one; never let two deploys race.
  group: deploy-site
  cancel-in-progress: false

env:
  AWS_REGION: us-west-2
  SITE_BUCKET: lovemesomecoding.com
  SITE_DISTRIBUTION: E30YUPLP37MY9U
  CONTENT_BUCKET: lovemesomecoding-db-329580012644-us-west-2-an
  NEXT_PUBLIC_SITE_URL: https://lovemesomecoding.com

permissions:
  contents: read
  id-token: write # for OIDC role assumption

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          # Preferred: OIDC. Set the AWS_DEPLOY_ROLE_ARN secret to a role trusting
          # this repo and the static keys below become unnecessary.
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Install dependencies
        run: npm ci

      - name: Sync content from S3
        run: npm run sync-content

      - name: Build
        # Fails if any of the 512 indexed post URLs stopped resolving.
        run: npm run build

      - name: Record build version
        run: echo "${GITHUB_SHA}" > out/version.txt

      - name: Deploy to S3 and invalidate CloudFront
        run: ./scripts/deploy.sh

      - name: Smoke test the deployment
        run: |
          set -euo pipefail
          BASE="https://lovemesomecoding.com"
          fail=0
          for path in / /java-8/java-25-migration-guide /java-8 /sitemap.xml /rss.xml /robots.txt; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 5 "$BASE$path")
            echo "  $code  $path"
            [ "$code" = "200" ] || fail=1
          done
          # A retired page must 301, not 404.
          code=$(curl -s -o /dev/null -w '%{http_code}' "$BASE/java-table-of-content")
          echo "  $code  /java-table-of-content (expect 301)"
          [ "$code" = "301" ] || fail=1
          exit $fail
